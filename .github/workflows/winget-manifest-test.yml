# For each package in winget-test/packages.json: generate the
# winget manifest the way winget-releaser does (komac update, dry run, so
# nothing is submitted), then on x64 and ARM64 Windows runners validate it and
# check fresh installs and an upgrade from the previous winget version.
name: winget-manifest-test
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.read.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: echo "packages=$(jq -c . winget-test/packages.json)" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install komac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ matrix.package.komac || '2.17.1' }}'
          gh release download "v$v" -R russellbanks/Komac -p "komac-$v-x86_64-unknown-linux-gnu.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/komac" && tar xzf "$RUNNER_TEMP"/komac-*.tar.gz -C "$RUNNER_TEMP/komac"
          echo "KOMAC=$(find "$RUNNER_TEMP/komac" -name komac -type f)" >> "$GITHUB_ENV"
      - name: komac update --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: 'true'
          NO_COLOR: '1'
          URLS: ${{ join(matrix.package.urls, ' ') }}
        run: |
          # shellcheck disable=SC2086
          "$KOMAC" update '${{ matrix.package.id }}' --version '${{ matrix.package.version }}' \
            --urls $URLS --dry-run --skip-pr-check < /dev/null > komac-out.txt
          python3 winget-test/split-manifests.py komac-out.txt 'manifest/${{ matrix.package.name }}'
          { echo '```yaml'; cat 'manifest/${{ matrix.package.name }}/${{ matrix.package.id }}.installer.yaml'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: manifest-${{ matrix.package.name }}
          path: manifest/${{ matrix.package.name }}

  test:
    needs: [plan, generate]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: manifest-${{ matrix.package.name }}
          path: manifest
      - name: Ensure winget
        shell: pwsh
        run: |
          # windows-latest (Server 2025) ships without winget; bootstrap it
          # with Microsoft's WinGet client module.
          $apps = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            if (-not (Get-PSRepository PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Microsoft.WinGet.Client -Scope AllUsers -Force -AllowClobber
            Import-Module Microsoft.WinGet.Client
            # Match the winget that windows-11-arm ships; fall back to latest.
            try { Repair-WinGetPackageManager -AllUsers -Force -Version 'v1.29.380' }
            catch { Write-Host "pinned version failed: $_"; Repair-WinGetPackageManager -AllUsers -Force -Latest }
            $env:Path += ";$apps"
          }
          Add-Content $env:GITHUB_PATH $apps
          winget --version
          winget settings --enable LocalManifestFiles
          # The msstore source is not involved and prompts for its terms.
          winget source remove msstore --disable-interactivity
          winget source update --disable-interactivity
      - name: Scenarios
        shell: pwsh
        run: >
          ./winget-test/scenarios.ps1
          -Id '${{ matrix.package.id }}'
          -Exe '${{ matrix.package.exe }}'
          -Manifest "$PWD\manifest"
          -Previous '${{ matrix.package.previous }}'
      - name: Upload winget logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: winget-logs-${{ matrix.package.name }}-${{ matrix.os }}
          path: ~\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir
          if-no-files-found: ignore
